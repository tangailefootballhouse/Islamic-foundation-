<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন প্যানেল - ইসলামিক ফাউন্ডেশন</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-color: #f3f5f4;
      --card-bg: #ffffff;
      --primary: #0a3225;
      --text-main: #111827;
      --text-muted: #6b7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; padding: 1rem; }
    .app-viewport { width: 100%; max-width: 480px; }

    .login-card { background: white; border-radius: 16px; padding: 1.5rem; border: 1px solid #e5e7eb; margin-top: 2rem; }
    .app-input { width: 100%; padding: 0.8rem; font-size: 0.9rem; border: 1.5px solid #e5e7eb; border-radius: 10px; margin-top: 4px; margin-bottom: 12px; }
    .btn-primary { width: 100%; background: var(--primary); color: white; padding: 0.8rem; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }

    .admin-header { background: var(--primary); color: white; padding: 1rem; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    
    .tab-group { display: flex; gap: 6px; margin-bottom: 1rem; }
    .tab-btn { flex: 1; padding: 8px; border: 1px solid #cbd5e1; background: white; border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .item-card { background: white; padding: 1rem; border-radius: 12px; border: 1px solid #e5e7eb; margin-bottom: 0.8rem; }
    .trx-box { background: #fef3c7; color: #92400e; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    
    .btn-action { padding: 6px 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem; flex: 1; }
    .btn-approve { background: #16a34a; color: white; }
    .btn-reject { background: #dc2626; color: white; }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- Login Screen -->
    <div id="loginScreen" class="login-card">
      <h3 style="color: var(--primary); text-align: center; margin-bottom: 1rem;">এডমিন প্যানেল লগইন</h3>
      <form id="loginForm">
        <label style="font-size: 0.8rem;">ইমেইল</label>
        <input type="email" id="email" class="app-input" required>
        <label style="font-size: 0.8rem;">পাসওয়ার্ড</label>
        <input type="password" id="password" class="app-input" required>
        <button type="submit" class="btn-primary">লগইন</button>
      </form>
    </div>

    <!-- Admin Dashboard Screen -->
    <div id="dashboardScreen" style="display: none;">
      <div class="admin-header">
        <div><strong>এডমিন ড্যাশবোর্ড</strong></div>
        <button style="background: rgba(255,255,255,0.2); color: white; border: none; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer;" onclick="auth.signOut()">লগআউট</button>
      </div>

      <!-- Tabs -->
      <div class="tab-group">
        <button class="tab-btn active" id="tabPending" onclick="switchTab('pending')">Pending</button>
        <button class="tab-btn" id="tabApproved" onclick="switchTab('approved')">Approved</button>
        <button class="tab-btn" id="tabRejected" onclick="switchTab('rejected')">Rejected</button>
      </div>

      <div id="dataList"></div>
    </div>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYprOtgffxdl84SfTAqs-RimfDVgA1FUs",
      authDomain: "islamic-foundation-ff85c.firebaseapp.com",
      projectId: "islamic-foundation-ff85c",
      storageBucket: "islamic-foundation-ff85c.firebasestorage.app",
      messagingSenderId: "1056969955210",
      appId: "1:1056969955210:web:a934896af07a156bb15a73"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentTab = 'pending';

    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboardScreen').style.display = 'block';
        loadData(currentTab);
      } else {
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('dashboardScreen').style.display = 'none';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
      } catch (err) {
        alert('লগইন ব্যর্থ হয়েছে!');
      }
    });

    function switchTab(status) {
      currentTab = status;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab' + status.charAt(0).toUpperCase() + status.slice(1)).classList.add('active');
      loadData(status);
    }

    function loadData(status) {
      db.collection('donations')
        .where('status', '==', status)
        .onSnapshot((snapshot) => {
          const list = document.getElementById('dataList');
          if (snapshot.empty) {
            list.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 1rem;">${status.toUpperCase()} কোনো ডাটা নেই।</p>`;
            return;
          }

          list.innerHTML = '';
          snapshot.forEach(doc => {
            const data = doc.data();
            
            let buttons = '';
            if (status === 'pending') {
              buttons = `
                <div style="display: flex; gap: 6px; margin-top: 8px;">
                  <button class="btn-action btn-approve" onclick="updateStatus('${doc.id}', 'approved')">Approve</button>
                  <button class="btn-action btn-reject" onclick="updateStatus('${doc.id}', 'rejected')">Reject</button>
                </div>
              `;
            } else if (status === 'rejected') {
              buttons = `
                <div style="display: flex; gap: 6px; margin-top: 8px;">
                  <button class="btn-action btn-approve" onclick="updateStatus('${doc.id}', 'approved')">Re-Approve</button>
                </div>
              `;
            }

            list.innerHTML += `
              <div class="item-card">
                <div style="display: flex; justify-content: space-between;">
                  <strong>${data.name}</strong>
                  <strong style="color: green;">৳${data.amount}</strong>
                </div>
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">
                  TrxID: <span class="trx-box">${data.fullTrxId}</span><br>
                  Phone: ${data.rawPhone || data.maskedPhone}
                </div>
                ${buttons}
              </div>
            `;
          });
        });
    }

    async function updateStatus(id, newStatus) {
      if (confirm(`স্ট্যাটাস পরিবর্তন করে ${newStatus.toUpperCase()} করতে চান?`)) {
        await db.collection('donations').doc(id).update({ status: newStatus });
      }
    }
  </script>
</body>
        </html>
