<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>এডমিন প্যানেল - ইসলামিক ফাউন্ডেশন</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
    body { background: #f3f5f4; color: #111827; padding: 1.5rem; display: flex; justify-content: center; }
    .admin-card { width: 100%; max-width: 600px; background: #fff; padding: 1.5rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { color: #0a3225; margin-bottom: 1rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem; }
    .item { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
    .item-info { font-size: 0.9rem; margin-bottom: 0.8rem; line-height: 1.5; }
    .trx-highlight { background: #fef3c7; color: #92400e; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .btn-group { display: flex; gap: 10px; }
    button { flex: 1; padding: 0.6rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-approve { background: #16a34a; color: white; }
    .btn-reject { background: #dc2626; color: white; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>পেন্ডিং অনুদান যাচাইকরণ (Admin Panel)</h2>
    <div id="pendingFeed">
      <p style="text-align: center; color: #6b7280;">পেন্ডিং ডাটা লোড হচ্ছে...</p>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDYprOtgffxdl84SfTAqs-RimfDVgA1FUs",
      authDomain: "islamic-foundation-ff85c.firebaseapp.com",
      projectId: "islamic-foundation-ff85c",
      storageBucket: "islamic-foundation-ff85c.firebasestorage.app",
      messagingSenderId: "1056969955210",
      appId: "1:1056969955210:web:a934896af07a156bb15a73"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Load Pending Items
    db.collection('donations')
      .where('status', '==', 'pending')
      .onSnapshot((snapshot) => {
        const feed = document.getElementById('pendingFeed');
        if (snapshot.empty) {
          feed.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 1rem;">কোনো পেন্ডিং অনুদান নেই।</p>';
          return;
        }

        feed.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          const item = document.createElement('div');
          item.className = 'item';
          item.innerHTML = `
            <div class="item-info">
              <strong>নাম:</strong> ${data.name}<br>
              <strong>অনুদানের পরিমাণ:</strong> ৳ ${data.amount}<br>
              <strong>ফুল TrxID (যাচাই করার জন্য):</strong> <span class="trx-highlight">${data.fullTrxId}</span><br>
              <strong>মোবাইল নম্বর:</strong> ${data.maskedPhone}
            </div>
            <div class="btn-group">
              <button class="btn-approve" onclick="approveDonation('${doc.id}')">Approve (অনুমোদন)</button>
              <button class="btn-reject" onclick="rejectDonation('${doc.id}')">Reject (বাতিল)</button>
            </div>
          `;
          feed.appendChild(item);
        });
      });

    // Approve Function
    async function approveDonation(id) {
      if (confirm('আপনি কি এই অনুদানটি অনুমোদন করতে চান?')) {
        await db.collection('donations').doc(id).update({ status: 'approved' });
        alert('অনুমোদিত হয়েছে! এটি এখন লাইভ বোর্ডে দেখাবে।');
      }
    }

    // Reject Function
    async function rejectDonation(id) {
      if (confirm('আপনি কি এই অনুদানটি বাতিল করতে চান?')) {
        await db.collection('donations').doc(id).delete();
        alert('বাতিল করা হয়েছে।');
      }
    }
  </script>
</body>
</html>
